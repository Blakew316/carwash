# Publish the site to GitHub Pages via the gh-pages branch.
#
# Pages for this repo is configured with source "Deploy from a branch"
# (gh-pages). This workflow mirrors the default branch into gh-pages;
# GitHub's internal pages-build-deployment pipeline publishes it.
#
# Do NOT add an actions/deploy-pages job here: with a branch-based
# source those API deployments are never processed - they sit in
# deployment_queued holding the Pages deployment lock, which blocks the
# real branch deployment ("due to in progress deployment") until they
# time out.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["claude/website-file-sync-gpw5ll"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" --allow-empty
          git push --force origin HEAD:gh-pages
