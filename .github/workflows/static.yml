# Publish the site to GitHub Pages via the gh-pages branch.
#
# The Pages site was disabled on this repo and the Actions token is not
# allowed to re-create it through the Pages API ("Resource not accessible
# by integration"), so the artifact-based deploy (configure-pages /
# deploy-pages) cannot run. Instead, this workflow mirrors the default
# branch into a gh-pages branch, which GitHub publishes through the
# branch-based Pages pipeline.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["claude/car-wash-website-Si38b"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" --allow-empty
          git push --force origin HEAD:gh-pages
