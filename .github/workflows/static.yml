# Publish the site to GitHub Pages.
#
# Two publish paths run in parallel so the deploy works regardless of which
# source is selected in Settings -> Pages:
#   - "deploy" uses the artifact-based Pages API (works when Source is
#     "GitHub Actions"). It is continue-on-error so a source mismatch
#     doesn't fail the run.
#   - "publish-branch" mirrors the tree into the gh-pages branch (works
#     when Source is "Deploy from a branch" / gh-pages).
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["claude/website-file-sync-gpw5ll"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" --allow-empty
          git push --force origin HEAD:gh-pages
